spring.application.name=ToDo-List
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://to-do-list-java.vercel.app,https://todo.commedeschamps.dev}

ai.enabled=${AI_ENABLED:false}
ai.primary.provider=${AI_PRIMARY_PROVIDER:gemini}
ai.primary.base-url=${AI_PRIMARY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
ai.primary.model=${AI_PRIMARY_MODEL:gemini-2.5-flash}
ai.primary.api-key=${AI_PRIMARY_API_KEY:}
ai.fallback.enabled=${AI_FALLBACK_ENABLED:true}
ai.fallback.provider=${AI_FALLBACK_PROVIDER:groq}
ai.fallback.base-url=${AI_FALLBACK_BASE_URL:https://api.groq.com/openai/v1}
ai.fallback.model=${AI_FALLBACK_MODEL:llama-3.1-8b-instant}
ai.fallback.api-key=${AI_FALLBACK_API_KEY:}
ai.backup.enabled=${AI_BACKUP_ENABLED:true}
ai.backup.provider=${AI_BACKUP_PROVIDER:openrouter}
ai.backup.base-url=${AI_BACKUP_BASE_URL:https://openrouter.ai/api/v1}
ai.backup.model=${AI_BACKUP_MODEL:openrouter/free}
ai.backup.api-key=${AI_BACKUP_API_KEY:}
