spring.datasource.url=jdbc:h2:mem:todolist-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
jwt.secret=test-secret-key-which-is-32-chars!!
ai.enabled=false
ai.primary.provider=gemini
ai.primary.base-url=https://generativelanguage.googleapis.com/v1beta/openai
ai.primary.model=gemini-test-model
